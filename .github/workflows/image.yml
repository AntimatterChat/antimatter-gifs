name: Build the image

# Tests the service, then builds ghcr.io/antimatterchat/antimatter-gifs for linux/amd64 and
# linux/arm64. Pushes to the default branch publish `latest`, v* tags publish their version, every
# build publishes `sha-<commit>`; pull requests only build.
on:
  push:
    branches: [antimatter]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: Extra image tag (e.g. 1.0.0)
        required: false
        default: ""
      push:
        description: Push the image to the registry
        type: boolean
        default: true

permissions:
  contents: read

env:
  IMAGE: ghcr.io/antimatterchat/antimatter-gifs
  PLATFORMS: linux/amd64,linux/arm64

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # The media tests use ffmpeg and rsvg-convert, like imports in the image.
      - name: Install media tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg gifsicle librsvg2-bin fonts-dejavu-core
      - run: go vet ./...
      - run: go test ./...

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=${{ inputs.version }},enable=${{ inputs.version != '' }}
            type=sha
          labels: |
            org.opencontainers.image.title=antimatter-gifs
            org.opencontainers.image.description=Self-hosted GIF and sticker service for Antimatter, with the Tenor API v2
            org.opencontainers.image.licenses=AGPL-3.0-only AND CC-BY-4.0
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: ${{ env.PLATFORMS }}
          push: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.push) }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=image
          cache-to: type=gha,mode=max,scope=image
