name: Release

# Builds the release files with GoReleaser (.goreleaser.yaml): static gifs-server binaries for
# linux/amd64 and linux/arm64 in .tar.gz archives, .deb and .rpm packages (systemd service,
# gifs-server system user, settings in /etc/gifs-server) and a SHA256SUMS file.
#
# - A v* tag publishes them as the GitHub release of the tag (version = the tag without "v"; a
#   prerelease when the tag has a "-", e.g. v1.2.0-rc.1), with notes generated by GitHub.
# - A manual run builds a snapshot and uploads the files as workflow artifacts only, or also as a
#   draft prerelease when "draft" is ticked.
#
# The Docker image is built by image.yml.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      draft:
        description: Also publish the build as a draft prerelease
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # The media tests use ffmpeg and rsvg-convert, like image.yml.
      - name: Install media tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg gifsicle librsvg2-bin fonts-dejavu-core
      - name: Test
        run: go test ./...
      - name: Build
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: v2.18.3
          # A tag builds that version; anything else builds a snapshot (0.0.0-SNAPSHOT-<commit>).
          args: release --clean ${{ startsWith(github.ref, 'refs/tags/v') && '--skip=publish' || '--snapshot' }}
      - name: Upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gifs-server-release
          if-no-files-found: error
          path: |
            dist/*.tar.gz
            dist/*.deb
            dist/*.rpm
            dist/SHA256SUMS

  release:
    name: Publish the release
    needs: build
    if: github.event_name == 'push' || inputs.draft
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: gifs-server-release
          path: release
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          cd release
          sha256sum -c SHA256SUMS
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            tag="$GITHUB_REF_NAME"
            if gh release view "$tag" >/dev/null 2>&1; then
              gh release upload "$tag" --clobber ./*
              exit 0
            fi
            flags=(--verify-tag --generate-notes --title "gifs-server ${tag#v}")
            case "$tag" in *-*) flags+=(--prerelease) ;; esac
            gh release create "$tag" "${flags[@]}" ./*
          else
            tag="dev-${GITHUB_RUN_NUMBER}"
            run="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            gh release create "$tag" --draft --prerelease --target "$GITHUB_SHA" \
              --title "gifs-server development build ${GITHUB_SHA::7}" \
              --notes "Development build of ${GITHUB_SHA} (${run}). Not a release." \
              ./*
          fi
